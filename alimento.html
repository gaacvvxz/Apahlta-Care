<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimento | Aphalta Care</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Aphalta Care</h1><p>Recomendación de alimento</p></header>
<nav><a href="index.html">Inicio</a><a href="vacunacionbase2.html">Vacunación</a><a href="alimento.html">Alimento</a><a href="veterinarios.html">Mejores veterinarios</a></nav>
<main>
<div class="card">
<h2>Datos de la mascota</h2>
<form id="formAlimento">
<label for="nombre">Nombre de la mascota</label>
<input type="text" id="nombre" required>
<label for="especie">Especie</label>
<select id="especie">
<option value="perro">Perro</option>
<option value="gato">Gato</option>
<option value="conejo">Conejo</option>
</select>
<label for="raza">Raza</label>
<input type="text" id="raza" required>
<label for="edad">Edad (en años)</label>
<input type="number" id="edad" min="0" max="30" step="0.5" required>
<button type="submit">Recomendar alimento</button>
</form>
</div>
<div id="resultado"></div>
</main>
<script>
document.getElementById("formAlimento").addEventListener("submit", function (e) {
  e.preventDefault();
  let nombre = document.getElementById("nombre").value;
  let especie = document.getElementById("especie").value;
  let raza = document.getElementById("raza").value;
  let edad = Number(document.getElementById("edad").value);
  let consejo;

  if (especie === "perro") {
    if (edad < 1) consejo = "Alimento para cachorro, alto en proteína y calorías, de 3 a 4 comidas pequeñas al día.";
    else if (edad < 7) consejo = "Alimento para perro adulto con proteína balanceada, 2 comidas al día.";
    else consejo = "Alimento para perro senior: menos calorías, apoyo para articulaciones (glucosamina), 2 comidas al día.";
  } else if (especie === "gato") {
    if (edad < 1) consejo = "Alimento para gatito, rico en proteína y grasa, de 3 a 4 comidas al día. Agrega alimento húmedo.";
    else if (edad < 10) consejo = "Alimento para gato adulto, alto en proteína animal. Combina croquetas y alimento húmedo y deja agua fresca disponible.";
    else consejo = "Alimento para gato senior: fácil de digerir, cuidado para los riñones, principalmente húmedo.";
  } else {
    if (edad < 0.5) consejo = "Heno de alfalfa ilimitado y pellets para conejo joven.";
    else consejo = "Heno de timothy ilimitado (80% de la dieta), una porción pequeña de pellets y verduras de hoja verde frescas a diario.";
  }

  let caja = document.getElementById("resultado");
  caja.style.display = "block";
  caja.innerHTML = "<strong>" + nombre + "</strong> (" + raza + ", " + edad + " años):<br>" + consejo +
    "<br>Evita chocolate, uvas, cebolla y ajo. Consulta a tu veterinario las necesidades propias de la raza.";
});
</script>
</body>
</html>
